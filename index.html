<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Autobot Command Center</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #1a1a1a; margin-top: 0; font-size: 24px; text-align: center; }
        .badge { background: #e1e1e1; color: #555; padding: 4px 8px; border-radius: 4px; font-size: 12px; vertical-align: middle; }
        
        form { margin-top: 25px; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input[type="text"]:focus { border-color: #3498db; outline: none; }
        
        button { width: 100%; background-color: #3498db; color: white; padding: 15px; margin-top: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #2980b9; }
        
        #status-box { margin-top: 25px; padding: 15px; border-radius: 8px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .queue-info { margin-top: 10px; font-size: 14px; color: #666; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 Autobot Command Center <span class="badge">v2.0</span></h1>
        <p style="text-align: center; color: #666;">Queue your series downloads below.</p>
        
        <form id="download-form">
            <input type="text" id="series-url" name="url" placeholder="Paste Thenkiri URL here..." required>
            <button type="submit">Add to Queue</button>
        </form>

        <div id="status-box"></div>
    </div>

    <script>
        document.getElementById('download-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const urlInput = document.getElementById('series-url');
            const statusBox = document.getElementById('status-box');
            const seriesUrl = urlInput.value;

            // Reset UI
            statusBox.style.display = 'block';
            statusBox.className = 'info';
            statusBox.textContent = 'Communicating with HQ...';

            const formData = new URLSearchParams();
            formData.append('url', seriesUrl);

            try {
                const response = await fetch('http://127.0.0.1:8000/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    statusBox.className = 'success';
                    
                    // Different messages based on queue position
                    if (data.message.includes("immediately")) {
                        statusBox.innerHTML = `✅ <strong>Started!</strong> The worker was idle, so your download is running now.`;
                    } else {
                        statusBox.innerHTML = `zzz <strong>Queued.</strong> You are #${data.queue_position} in line. It will start automatically.`;
                    }
                    
                    urlInput.value = ''; // Clear input
                } else {
                    statusBox.className = 'error';
                    statusBox.textContent = `❌ Error: ${data.message}`;
                }

            } catch (error) {
                statusBox.className = 'error';
                statusBox.textContent = `🛑 Server Offline. Is Uvicorn running?`;
            }
        });
    </script>
</body>
</html>
